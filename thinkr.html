    <style>
      :root {
        --bg: #080808;
        --panel: #0b0b0b;
        --card: #0b0b0b;
        --text: #fafafa;
        --muted: #a3a3a3;
        --line: rgba(255, 255, 255, 0.24);
        --active: rgba(255, 255, 255, 0.65);
        --grid: rgba(255, 255, 255, 0.055);
        --accent: #fafafa;
        --accent-soft: #181818;
        --inverse: #080808;
        --selection: #fafafa;
        --selection-text: #080808;
        --shadow: none;
        --yellow: var(--card);
        --green: var(--card);
        --blue: var(--card);
        --pink: var(--card);
        color-scheme: dark;
      }
      [data-theme="light"] {
        --bg: #fafafa;
        --panel: #f2f2f2;
        --card: #fafafa;
        --text: #080808;
        --muted: #595959;
        --line: rgba(0, 0, 0, 0.24);
        --active: rgba(0, 0, 0, 0.65);
        --grid: rgba(0, 0, 0, 0.055);
        --accent: #080808;
        --accent-soft: #e5e5e5;
        --inverse: #fafafa;
        --selection: #080808;
        --selection-text: #fafafa;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        border-radius: 0 !important;
        box-shadow: none !important;
        font-variant-numeric: tabular-nums lining-nums;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font:
          13px/1.6 ui-monospace,
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 4px 8px;
      }
      button:hover {
        background: var(--text);
        color: var(--inverse);
        border-color: var(--text);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
        border-style: dotted;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 1px solid var(--text);
        outline-offset: 2px;
      }
      input,
      textarea,
      select {
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 8px;
        outline: none;
      }
      input:hover,
      textarea:hover,
      select:hover {
        border-color: var(--active);
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--text);
      }
      button.icon {
        width: 32px;
        height: 32px;
        display: inline-grid;
        place-items: center;
        flex-shrink: 0;
        padding: 0;
      }
      .small {
        font-size: 11px;
        color: var(--muted);
      }
      kbd {
        font-family: inherit;
        font-size: 10px;
        line-height: 1.5;
        padding: 2px 4px;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .hidden {
        display: none !important;
      }
      #app {
        height: 100%;
        display: flex;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      #sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        z-index: 4;
      }
      body.sidebar-hidden #sidebar {
        margin-left: -240px;
      }
      .brand {
        height: 72px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand-mark {
        font-size: 18px;
        color: var(--muted);
      }
      .brand-name {
        font-size: 23px;
        font-weight: 400;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .brand small {
        display: block;
        font-size: 9px;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-top: 0;
      }
      .sidebar-actions {
        height: 48px;
        display: flex;
        padding: 8px 12px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .sidebar-actions > div {
        display: flex;
      }
      .sidebar-actions button + button {
        border-left: 0;
      }
      .eyebrow {
        font-size: 10px;

    <script>
      "use strict";
      /* Thinkr: one document, one IndexedDB record. All positions are world coordinates. */
      const $ = (s) => document.querySelector(s),
        $$ = (s) => [...document.querySelectorAll(s)],
        clone = (v) => JSON.parse(JSON.stringify(v));
      const uid = () =>
        crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const safeURL = (s) =>
        /^(note:[a-z0-9-]+$|https?:|mailto:|data:image\/(png|jpe?g|gif|webp|avif|bmp);base64,)/i.test(
          s,
        )
          ? s
          : "";
      let state,
        db,
        selected = new Set(),
        selectedEdge = null,
        editing = null,
        editBefore = null,
        savedRange = null,
        space = false,
        gesture = null,
        connectFrom = null,
        folderTarget = null;
      let undoStack = [],
        redoStack = [],
        saveTimer,
        writeChain = Promise.resolve(true),
        revision = 0,
        dirty = false,
        palette = null,
        slash = null,
        toastTimer,
        treeDrag = null;
      const viewport = $("#viewport"),
        world = $("#world");
      const canvas = () => state.canvases.find((c) => c.id === state.active);
      const note = (id) => canvas().notes.find((n) => n.id === id);
      const view = () => canvas().view;
      const point = (x, y) => {
        const r = viewport.getBoundingClientRect(),
          v = view();
        return { x: (x - r.left - v.x) / v.z, y: (y - r.top - v.y) / v.z };
      };
      const center = () =>
        point(
          viewport.getBoundingClientRect().left + viewport.clientWidth / 2,
          viewport.getBoundingClientRect().top + viewport.clientHeight / 2,
        );
      const bodyEl = (id) =>
        document.getElementById("note-" + id)?.querySelector(".note-body");
      const snapshot = () => ({
        ...state,
        folders: clone(state.folders),
        canvases: state.canvases.map((c) => {
          const { assets, ...rest } = c;
          return {
            ...clone(rest),
            ...(assets ? { assets: { ...assets } } : {}),
          };
        }),
      });
      const comparableState = (s) =>
        JSON.stringify({
          ...s,
          canvases: s.canvases.map((c) => ({
            ...c,
            assets: Object.keys(c.assets || {}),
          })),
        });
      function toast(message) {
        $(".toast")?.remove();
        const el = document.createElement("div");
        el.className = "toast";
        el.setAttribute("role", "status");
        el.textContent = message;
        document.body.append(el);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.remove(), 3500);
      }
      function record(before) {
        if (comparableState(before) === comparableState(state)) return;
        for (const old of before.canvases) {
          const current = state.canvases.find((c) => c.id === old.id);
          if (
            !current ||
            old.notes.some((n) => !current.notes.some((x) => x.id === n.id))
          )
            queueCheckpoint(old, "Before deletion", true);
        }
        undoStack.push(before);
        if (undoStack.length > 60) undoStack.shift();
        redoStack = [];
        scheduleSave();
      }
      function change(fn) {
        finishEdit();
        const before = snapshot();
        fn();
        state.canvases.forEach(cleanGroups);
        record(before);
        render();
      }
      function undo() {
        finishEdit();
        if (!undoStack.length) return;
        redoStack.push(snapshot());
        state = undoStack.pop();
        selected.clear();
        selectedEdge = null;
        folderTarget = null;
        render();
        scheduleSave();
      }
      function redo() {
        finishEdit();
        if (!redoStack.length) return;
        undoStack.push(snapshot());
        state = redoStack.pop();
        selected.clear();
        selectedEdge = null;
        folderTarget = null;
        render();
        scheduleSave();
      }
      /* Recovery snapshots live separately from the current workspace and share image bytes. */
      let recoveryTimer,
        recoveryClock = 0,
        recoveryPending = [],
        recoverySignatures = new Map();
      const recoverySignature = (c) => {
        const { view, assets, ...content } = c;
        return JSON.stringify({
          ...content,
          assets: Object.keys(assets || {}).sort(),
        });
      };
      function queueCheckpoint(
        c,
        label = "Automatic checkpoint",
        force = false,
      ) {
        const signature = recoverySignature(c);
        if (!force && recoverySignatures.get(c.id) === signature) return;
        const saved = portableCanvas(c),
          { assets = {}, ...content } = saved;
        const entry = {
          id: uid(),
          canvasId: c.id,
          name: c.name,
          time: (recoveryClock = Math.max(Date.now(), recoveryClock + 1)),
          label,
          signature,
          canvas: content,
          assetKeys: Object.keys(assets).map((id) => c.id + ":" + id),
        };
        recoveryPending.push({ entry, assets });
        recoverySignatures.set(c.id, signature);
      }
      function recoveryRead(store, key) {
        return new Promise((resolve, reject) => {
          const r = db
            .transaction(store)
            .objectStore(store)
            [key === undefined ? "getAll" : "get"](key);
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        });
      }
      async function primeRecovery() {
        const rows = await recoveryRead("history");
        recoveryClock = Math.max(0, ...rows.map((r) => r.time));
        rows
          .sort((a, b) => a.time - b.time)
          .forEach((r) => recoverySignatures.set(r.canvasId, r.signature));
        state.canvases.forEach((c) => queueCheckpoint(c, "Opened canvas"));
        if (recoveryPending.length) scheduleSave();
      }
      function scheduleSave() {
        dirty = true;
        revision++;
        $("#save-status").textContent = "Saving…";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(flushSave, 180);
        clearTimeout(recoveryTimer);
        recoveryTimer = setTimeout(() => {
          state.canvases.forEach((c) => queueCheckpoint(c));
          flushSave();
        }, 1500);
      }
      function flushSave() {
        clearTimeout(saveTimer);
        if (!db) return Promise.resolve(false);
        if (!dirty && !recoveryPending.length) return writeChain;
        const data = snapshot(),
          rev = revision,
          frames = recoveryPending.splice(0);
        dirty = false;
        writeChain = writeChain
          .catch(() => false)
          .then(
            () =>
              new Promise((resolve, reject) => {
                const tx = db.transaction(
                  ["workspace", "history", "historyAssets"],
                  "readwrite",
                );
                tx.objectStore("workspace").put(data, "main");
                const hs = tx.objectStore("history"),
                  as = tx.objectStore("historyAssets");
                for (const { entry, assets } of frames) {
                  hs.put(entry);
                  for (const [id, asset] of Object.entries(assets))
                    as.put({ key: entry.canvasId + ":" + id, asset });
                }
                if (frames.length) {
                  const r = hs.getAll();
                  r.onsuccess = () => {
                    const counts = new Map(),
                      keep = [];
                    r.result
                      .sort((a, b) => b.time - a.time)
                      .forEach((row) => {
                        const n = (counts.get(row.canvasId) || 0) + 1;
                        counts.set(row.canvasId, n);
                        if (n <= 20) keep.push(row);
                        else hs.delete(row.id);
                      });
                    const used = new Set(keep.flatMap((r) => r.assetKeys));
                    const keys = as.getAllKeys();
                    keys.onsuccess = () =>
                      keys.result.forEach((key) => {
                        if (!used.has(key)) as.delete(key);
                      });
                  };
                }
                tx.oncomplete = () => {
                  if (rev === revision)
                    $("#save-status").textContent = "All changes saved";
                  resolve(true);
                };
                tx.onabort = tx.onerror = () =>
                  reject(tx.error || Error("Save failed"));
              }),
          )
          .catch(() => {
            dirty = true;
            recoveryPending.unshift(...frames);
            $("#save-status").textContent = "Save failed — export a backup";
            toast("! Could not save. Export a Thinkr backup before closing.");
            return false;
          });
        return writeChain;
      }
      async function manualCheckpoint() {
        finishEdit();
        queueCheckpoint(canvas(), "Manual checkpoint", true);
        if (await flushSave()) toast("Recovery checkpoint saved.");
      }
      async function restoreCheckpoint(id) {
        try {
          const row = await recoveryRead("history", id);
          if (!row) throw Error("Missing checkpoint");
          const assets = {};
          for (const key of row.assetKeys) {
            const value = await recoveryRead("historyAssets", key);
            if (!value) throw Error("Missing image");
            assets[value.asset.id] = value.asset;
          }
          const restored = validateCanvas({ ...row.canvas, assets });
          restored.id = row.canvasId;
          restored.folder = state.folders.some(
            (f) => f.id === row.canvas.folder,
          )
            ? row.canvas.folder
            : null;
          showDialog(
            '<div class="dialog-head"><span class="dialog-title">Restore ' +
              esc(row.name) +
              '?</span><button class="icon" data-close>×</button></div><div class="dialog-body"><p>' +
              esc(new Date(row.time).toLocaleString()) +
              " · " +
              restored.notes.length +
              ' elements</p><p>The current canvas will be saved as a checkpoint first. This restoration can also be undone.</p><div class="form-actions"><button id="confirm-restore" class="primary">Restore checkpoint</button></div></div>',
          );
          $("#confirm-restore").onclick = async () => {
            const b = $("#confirm-restore");
            b.disabled = true;
            finishEdit();
            const current = state.canvases.find((c) => c.id === restored.id);
            if (current) queueCheckpoint(current, "Before restore", true);
            if (!(await flushSave())) {
              b.disabled = false;
              return;
            }
            closeDialog();
            change(() => {
              const i = state.canvases.findIndex((c) => c.id === restored.id);
              if (i < 0) state.canvases.push(restored);
              else state.canvases[i] = restored;
              state.active = restored.id;
              selected.clear();
              selectedEdge = null;
            });
            queueCheckpoint(restored, "Restored checkpoint", true);
            await flushSave();
            toast("Canvas restored.");
          };
        } catch {
          toast(
            "! Could not read that checkpoint. The current canvas is unchanged.",
          );
        }
      }
      async function showHistory(all = false) {
        finishEdit();
        if (!db) {
          toast("! Recovery needs browser storage.");
          return;
        }
        state.canvases.forEach((c) => queueCheckpoint(c));
        if (!(await flushSave())) return;
        try {
          const rows = (await recoveryRead("history"))
            .filter((r) => all || r.canvasId === state.active)
            .sort((a, b) => b.time - a.time);
          showDialog(
            '<div class="dialog-head"><span class="dialog-title">Recovery history</span><button class="icon" data-close>×</button></div><div class="dialog-body"><p>Up to 20 checkpoints per canvas, stored in this browser. Export a .thinkr file for a portable backup.</p><div class="history-controls"><button id="history-scope">' +
              (all ? "Current canvas" : "All canvases · include deleted") +
              '</button><button id="history-save">Save checkpoint</button></div></div><div class="recovery-list">' +
              (rows
                .map(
                  (r) =>
                    '<button data-restore="' +
                    esc(r.id) +
                    '"><strong>' +
                    esc(r.name) +
                    "</strong><span>" +
                    esc(new Date(r.time).toLocaleString()) +
                    " · " +
                    r.canvas.notes.length +
                    " elements</span><small>" +
                    esc(r.label) +
                    "</small></button>",
                )
                .join("") || '<p class="dialog-body">No checkpoints yet.</p>') +
              "</div>",
          );
          $("#history-scope").onclick = () => showHistory(!all);
          $("#history-save").onclick = async () => {
            await manualCheckpoint();
            showHistory(all);
          };
          $$("[data-restore]", $("#dialog")).forEach(
            (b) => (b.onclick = () => restoreCheckpoint(b.dataset.restore)),
          );
        } catch {
          toast("! Recovery history could not be opened.");
        }
      }
      function welcome() {
        const id = uid(),
          a = uid(),
          b = uid(),
          c = uid(),
          d = uid();
        return {
          version: 1,
          theme: "dark",
          uiVersion: 2,
          sidebar: true,
          active: id,
          folders: [],
          canvases: [
            {
              id,
              name: "A place to begin",
              folder: null,
              view: { x: 85, y: 120, z: 1 },
              notes: [
                {
                  id: a,
                  x: 0,
                  y: 0,
                  w: 330,
                  h: 255,
                  color: "default",
                  text: "# Make room for a thought.\n\nBig ideas usually start small. Give yours somewhere to land.\n\nDouble-click the canvas or press **N**. Start typing.",
                },
                {
                  id: b,
                  x: 425,
                  y: 25,
                  w: 290,
                  h: 205,
                  color: "yellow",
                  text: "### Follow the thread\n\nDrag the small square on a note to another note.\n\nOne thought leads to the next.",
                },
                {

                  x: 45,

          moving = g.positions.map((p) => ({
            ...note(p.id),
            x: p.x + dx,
            y: p.y + dy,
          })),
          b = boundsOf(moving),
          tolerance = 6 / view().z;
        const xs = [b.x, (b.x + b.right) / 2, b.right],
          ys = [b.y, (b.y + b.bottom) / 2, b.bottom];
        let sx = null,
          sy = null;
        for (const n of canvas().notes) {
          if (ids.has(n.id)) continue;
          for (const target of [n.x, n.x + n.w / 2, n.x + n.w])
            for (const edge of xs) {
              const delta = target - edge;
              if (
                Math.abs(delta) <= tolerance &&
                (!sx || Math.abs(delta) < Math.abs(sx.delta))

                sx = {
                  delta,
                  target,
                  min: Math.min(b.y, n.y) - 24,
                  max: Math.max(b.bottom, n.y + n.h) + 24,
                };
            }
          for (const target of [n.y, n.y + n.h / 2, n.y + n.h])
            for (const edge of ys) {

              if (
                Math.abs(delta) <= tolerance &&

                  target,
                  min: Math.min(b.x, n.x) - 24,

        else dx += Math.round(b.x / 8) * 8 - b.x;

          ["x", sx],
          ["y", sy],

            axis === "x"
              ? `left:${s.target}px;top:${s.min}px;width:${1 / view().z}px;height:${s.max - s.min}px`

      function validateCanvas(raw) {
        if (
          !raw ||
          typeof raw.name !== "string" ||
          !Array.isArray(raw.notes) ||
          !Array.isArray(raw.edges)
        )
          throw Error("Invalid canvas");

          ids = new Set(),
          groupIds = new Set();

          if (
            !a ||
            a.id !== id ||

              a.data,
            ) ||
            ![a.width, a.height].every((v) => Number.isFinite(v) && v > 0)

            id,
            data: a.data,
            width: a.width,
            height: a.height,
            name: typeof a.name === "string" ? a.name : "Image",
            ...(/^https?:/i.test(a.source || "") ? { source: a.source } : {}),
          };
        }
        const groups = (raw.groups || []).map((g) => {
          if (typeof g.id !== "string" || groupIds.has(g.id))
            throw Error("Invalid group");
          groupIds.add(g.id);
          return {
            id: g.id,
            label: typeof g.label === "string" ? g.label : "",
          };
        });
        const notes = raw.notes.map((n) => {
          if (
            !n ||
            typeof n.id !== "string" ||
            ids.has(n.id) ||
            typeof n.text !== "string" ||
            ![n.x, n.y, n.w, n.h].every(Number.isFinite)
          )
            throw Error("Invalid note");
          ids.add(n.id);
          const out = {
            id: n.id,
            text: n.text,
            x: n.x,
            y: n.y,
            w: Math.max(n.type === "image" ? 64 : 180, n.w),
            h: Math.max(n.type === "image" ? 32 : 110, n.h),
            color: ["default", "yellow", "green", "blue", "pink"].includes(
              n.color,
            )
              ? n.color
              : "default",
          };
          if (n.type === "image") {
            if (!assets[n.image]) throw Error("Missing image");

            out.image = n.image;
            out.caption = typeof n.caption === "string" ? n.caption : "";

          if (n.groupId) {
            if (!groupIds.has(n.groupId)) throw Error("Missing group");

            applyView();
            scheduleSave();
          }
        },
        { passive: false },
      );
      viewport.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        finishEdit();
        const el = e.target.closest(".note");
        if (el) {
          noteMenu(el.dataset.id, e.clientX, e.clientY);
        } else
          contextMenu(e.clientX, e.clientY, [
            {
              label: "New note here",
              action: () => newNote(point(e.clientX, e.clientY)),
            },
            { label: "Add image…", action: chooseImageFile },
            { label: "Recovery history", action: showHistory },
            { label: "Fit all notes", action: fit },
            { label: "Import canvas", action: () => $("#import-file").click() },
          ]);
      });
      viewport.addEventListener("beforeinput", handleEditorInput);
      viewport.addEventListener("input", captureNativeEditorInput);
      viewport.addEventListener("compositionstart", () => {
        if (editing) editorComposition = editorFrame();
      });
      viewport.addEventListener("compositionend", () =>
        setTimeout(() => {
          if (!editing || !editorComposition) return;
          const f = editorComposition;
          editorComposition = null;
          if (f.source !== editorSource) {
            editorHistory.push(f);
            editorRedo = [];
          }
          renderEditor();
          syncEditor();
        }, 0),
      );
      viewport.addEventListener("paste", (e) => {
        if (!editing || !e.target.closest(".note-body")) return;
        e.preventDefault();
        const files = clipboardImages(e.clipboardData);
        if (files.length) insertImageFiles(files, imageTarget());
        else
          replaceEditorText(
            e.clipboardData.getData("text/markdown") ||
              e.clipboardData.getData("text/plain"),
          );
      });
      for (const type of ["copy", "cut"])
        document.addEventListener(type, (e) => {
          if (
            !editing ||
            !$("#overlay").classList.contains("hidden") ||
            !bodyEl(editing).contains(getSelection().anchorNode)
          )
            return;
          const c = editorSelection();
          if (c.from === c.to) return;
          e.preventDefault();
          e.clipboardData.setData(
            "text/plain",
            editorSource.slice(c.from, c.to),
          );
          if (type === "cut") replaceEditorText("", c);
        });
      document.addEventListener("paste", (e) => {
        if (
          e.defaultPrevented ||
          editing ||
          !$("#overlay").classList.contains("hidden")
        )
          return;
        const target = e.target.nodeType === 1 ? e.target : document.body;
        if (
          target.closest(
            'input,textarea,select,[contenteditable="true"],#sidebar',
          )
        )
          return;
        if (target !== document.body && !$("#main").contains(target)) return;
        const files = clipboardImages(e.clipboardData);
        if (files.length) {
          e.preventDefault();
          insertImageFiles(files, imageTarget());
          return;
        }
        const text =
          e.clipboardData.getData("text/markdown") ||
          e.clipboardData.getData("text/plain");
        if (!text.trim()) return;
        e.preventDefault();
        newNote(center(), text, false);
      });
      viewport.addEventListener("click", (e) => {
        const cap = e.target.closest("[data-image-caption]");
        if (cap) {
          editImageCaption(
            cap.closest(".note").dataset.id,
            cap.dataset.imageCaption,
          );
          return;
        }
        if (e.target.matches("input[type=checkbox]")) {
          const id = e.target.closest(".note").dataset.id;
          if (editing === id) {
            const p = +e.target.dataset.taskPos;
            if (Number.isFinite(p))
              applyEditorSource(
                editorSource.slice(0, p) +
                  (e.target.checked ? "x" : " ") +
                  editorSource.slice(p + 1),
                editorCursor,
              );
            return;
          }
          const before = snapshot();
          note(id).text = serialize(bodyEl(id));
          record(before);
        }
        const action = e.target.closest("[data-note-action]");
        if (action) {
          noteMenu(action.closest(".note").dataset.id, e.clientX, e.clientY);
          return;
        }
        const linked = e.target.closest("[data-note-link]");
        if (linked) {
          e.preventDefault();
          if (!editing || e.ctrlKey || e.metaKey)
            navigateNote(linked.dataset.noteLink);
          return;
        }
        const a = e.target.closest("a");
        if (a && editing && !e.ctrlKey && !e.metaKey) e.preventDefault();
      });
      /* Tree keyboard/drag controls. */
      $("#tree").addEventListener("click", (e) => {
        const row = e.target.closest("[data-tree]");
        if (!row) return;
        const { tree: id, kind } = row.dataset;
        if (e.target.closest(".more")) {
          e.stopPropagation();
          const r = e.target.getBoundingClientRect();
          treeMenu(id, kind, r.right, r.bottom);
          return;
        }
        if (kind === "canvas") switchCanvas(id);
        else {
          folderTarget = folderTarget === id ? null : id;
          const f = state.folders.find((f) => f.id === id);
          f.closed = !f.closed;
          renderTree();
          scheduleSave();
        }
      });
      $("#tree").addEventListener("contextmenu", (e) => {
        const row = e.target.closest("[data-tree]");
        if (!row) return;
        e.preventDefault();
        treeMenu(row.dataset.tree, row.dataset.kind, e.clientX, e.clientY);
      });
      $("#tree").addEventListener("keydown", (e) => {
        const row = e.target.closest("[data-tree]");
        if (!row) return;
        if (e.key === "Enter") {
          row.click();
          e.preventDefault();
        }
        if (e.key === "F2") {
          renameItem(row.dataset.tree, row.dataset.kind);
          e.preventDefault();
        }
      });
      function clearTreeDrop() {
        $$("#tree .drop-before, #tree .drop-after, #tree .drop-inside").forEach(
          (row) =>
            row.classList.remove("drop-before", "drop-after", "drop-inside"),
        );
      }
      function treeDropTarget(event) {
        const row = event.target.closest("[data-tree]");
        if (!row) return { row: null, destination: null, after: true };
        if (row.dataset.kind === "folder") {
          return { row, destination: row.dataset.tree, after: true };
        }
        const target = state.canvases.find((c) => c.id === row.dataset.tree);
        const rect = row.getBoundingClientRect();
        return {
          row,
          destination: target.folder,
          after: event.clientY >= rect.top + rect.height / 2,
        };
      }
      $("#tree").addEventListener("dragstart", (e) => {
        const row = e.target.closest("[data-tree]");
        if (!row) return;
        treeDrag = { id: row.dataset.tree, kind: row.dataset.kind };
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData(
          "application/thinkr-tree",
          JSON.stringify(treeDrag),
        );
        row.classList.add("dragging");
      });
      $("#tree").addEventListener("dragover", (e) => {
        if (!treeDrag) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        clearTreeDrop();
        const { row, after } = treeDropTarget(e);
        if (!row || row.dataset.tree === treeDrag.id) return;
        row.classList.add(
          row.dataset.kind === "folder"
            ? "drop-inside"
            : after
              ? "drop-after"
              : "drop-before",
        );
      });
      $("#tree").addEventListener("dragleave", (e) => {
        if (!$("#tree").contains(e.relatedTarget)) clearTreeDrop();
      });
      $("#tree").addEventListener("dragend", () => {
        treeDrag = null;
        clearTreeDrop();
        $$("#tree .dragging").forEach((row) =>
          row.classList.remove("dragging"),
        );
      });
      $("#tree").addEventListener("drop", (e) => {
        const raw = e.dataTransfer.getData("application/thinkr-tree");
        if (!raw) return;
        e.preventDefault();
        const { id, kind } = JSON.parse(raw);
        const { row, destination, after } = treeDropTarget(e);
        treeDrag = null;
        clearTreeDrop();
        if (row?.dataset.tree === id) return;
        if (kind === "folder") {
          let folder = state.folders.find((f) => f.id === destination);
          while (folder) {
            if (folder.id === id) {
              toast("A folder cannot contain itself.");
              return;
            }
            folder = state.folders.find((f) => f.id === folder.parent);
          }
        }
        change(() => {
          const items = kind === "folder" ? state.folders : state.canvases;
          const index = items.findIndex((item) => item.id === id);
          if (index === -1) return;
          const item = items[index];
          if (kind === "folder") item.parent = destination;
          else {
            item.folder = destination;
            // The persisted array is the order of sibling canvases. Remove first
            // so moving upward and downward uses the same insertion calculation.
            items.splice(index, 1);
            const targetIndex =
              row?.dataset.kind === "canvas"
                ? items.findIndex((c) => c.id === row.dataset.tree)
                : -1;
            items.splice(
              targetIndex < 0 ? items.length : targetIndex + (after ? 1 : 0),
              0,
              item,
            );
          }
          const folder = state.folders.find((f) => f.id === destination);
          if (folder) folder.closed = false;
        });
      });
      function run(action) {
        if (!state) return;
        const table = {
          group: groupSelection,
          ungroup: ungroupSelection,
          history: showHistory,
          "new-note": () => newNote(),
          "new-canvas": newCanvas,
          "new-folder": newFolder,
          delete: deleteSelected,
          duplicate: duplicateSelected,
          connect: connectSelection,
          edit: () => {
            if (selected.size) startEdit([...selected][0]);
          },
          search: () => openPalette("search"),
          palette: () => openPalette("commands"),
          export: exportDialog,
          import: () => $("#import-file").click(),
          theme: () => {
            state.theme = state.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = state.theme;
            scheduleSave();
          },
          sidebar: () => {
            state.sidebar = !state.sidebar;
            document.body.classList.toggle("sidebar-hidden", !state.sidebar);
            scheduleSave();
            setTimeout(positionEditor, 160);
          },
          "zoom-in": () => zoom(1.2),
          "zoom-out": () => zoom(1 / 1.2),
          "zoom-reset": () => zoom(1 / view().z),
          fit,
          help,
          undo,
          redo,
        };
        table[action]?.();
      }
      document.addEventListener("click", (e) => {
        const action = e.target.closest("[data-action]");
        if (action) run(action.dataset.action);
        const color = e.target.closest("[data-color]");
        if (color && color.classList.contains("note-style"))
          change(() => {
            for (const id of selected) note(id).color = color.dataset.color;
          });
        if (
          !e.target.closest(
            "#context-menu, #tree .more, [data-note-action=menu]",
          )
        )
          $("#context-menu").classList.add("hidden");
      });
      $("#canvas-title").onclick = () => renameItem(state.active, "canvas");
      $("#editor-bar").addEventListener("pointerdown", (e) => {
        e.preventDefault();
        rememberRange();
      });
      $("#editor-bar").addEventListener("click", (e) => {
        const b = e.target.closest("[data-format]");
        if (b) format(b.dataset.format);
      });
      $("#slash-menu").addEventListener("pointerdown", (e) =>
        e.preventDefault(),
      );
      $("#slash-menu").addEventListener("click", (e) => {
        const b = e.target.closest("[data-slash]");
        if (b) chooseSlash(+b.dataset.slash);
      });
      $("#overlay").addEventListener("pointerdown", (e) => {
        if (e.target === $("#overlay")) closeDialog();
      });
      document.addEventListener("selectionchange", rememberRange);
      document.addEventListener("keydown", (e) => {
        if (!state) return;
        const mod = e.ctrlKey || e.metaKey,
          key = e.key.toLowerCase(),
          dialog = !$("#overlay").classList.contains("hidden"),
          inInput =
            e.target.matches("input,textarea,select") ||
            e.target.isContentEditable;
        if (e.key === "Escape") {
          e.preventDefault();
          if (dialog) {
            closeDialog();
            return;
          }
          if (slash) {
            hideSlash();
            return;
          }
          if (editing) {
            finishEdit();
            viewport.focus();
            return;
          }
          connectFrom = null;
          selectedEdge = null;
          select(null);
          $("#context-menu").classList.add("hidden");
          return;
        }
        if (
          mod &&
          !e.altKey &&
          (["+", "=", "-"].includes(key) ||
            ["NumpadAdd", "NumpadSubtract"].includes(e.code))
        ) {
          e.preventDefault();
          if (!dialog)
            zoom(key === "-" || e.code === "NumpadSubtract" ? 1 / 1.2 : 1.2);
          return;
        }
        if (dialog) {
          if (e.key === "Tab") {
            const els = $$("#dialog input,#dialog select,#dialog button");
            const first = els[0],
              last = els.at(-1);
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last?.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first?.focus();
            }
          }
          return;
        }
        if (mod && (key === "p" || key === "k")) {
          e.preventDefault();
          openPalette(key === "k" ? "search" : "commands");
          return;
        }
        if (editing) {
          if (mod && e.key === "Enter") {
            e.preventDefault();
            finishEdit();
            viewport.focus();
            return;
          }
          if (
            slash &&
            ["ArrowUp", "ArrowDown", "Enter", "Tab"].includes(e.key)
          ) {
            e.preventDefault();
            if (e.key === "Enter" || e.key === "Tab") chooseSlash(slash.index);
            else {
              slash.index =
                (slash.index +
                  (e.key === "ArrowDown" ? 1 : -1) +
                  slash.items.length) %
                slash.items.length;
              $$("#slash-menu button").forEach((b, i) =>
                b.classList.toggle("active", i === slash.index),
              );
            }
            return;
          }
          if (editorKey(e, mod, key)) return;
          if (mod && (key === "b" || key === "i")) {
            e.preventDefault();
            format(key === "b" ? "bold" : "italic");
            return;
          }

          return;
        }
        if (inInput) return;
        if (mod && key === "g") {
          e.preventDefault();
          e.shiftKey ? ungroupSelection() : groupSelection();
          return;
        }
        if (mod && key === "l") {
          e.preventDefault();
          chooseNoteLink();
          return;
        }
        if (mod && key === "z") {
          e.preventDefault();
          e.shiftKey ? redo() : undo();
          return;
        }
        if (mod && key === "y") {
          e.preventDefault();
          redo();
          return;
        }
        if (mod && key === "d") {
          e.preventDefault();
          duplicateSelected();
          return;
        }
        if (mod && key === "a") {
          e.preventDefault();
          selected = new Set(canvas().notes.map((n) => n.id));
          selectionUI();
          return;
        }
        if (e.code === "Space") {
          e.preventDefault();
          space = true;
          viewport.style.cursor = "grab";
          return;
        }
        if (mod) return;
        if (key === "n") {
          e.preventDefault();
          newNote();
        } else if (key === "f") {
          e.preventDefault();
          fit();
        } else if (key === "c") {
          e.preventDefault();
          connectSelection();
        } else if (e.key === "Delete" || e.key === "Backspace") {
          e.preventDefault();
          deleteSelected();
        } else if (e.key === "Enter" && selected.size) {
          e.preventDefault();
          startEdit([...selected][0]);
        } else if (e.key === "Tab") {
          e.preventDefault();
          const ns = canvas().notes;
          if (!ns.length) return;
          let index = ns.findIndex((n) => selected.has(n.id));
          index = (index + (e.shiftKey ? -1 : 1) + ns.length) % ns.length;
          focusNote(ns[index].id);
        } else if (e.key.startsWith("Arrow")) {
          e.preventDefault();
          const current = note([...selected][0]);
          if (!current) {
            if (canvas().notes.length) focusNote(canvas().notes[0].id);
            return;
          }
          const dx =
              e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0,
            dy = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
          const candidates = canvas()
            .notes.filter(
              (n) =>
                n.id !== current.id &&
                (dx ? (n.x - current.x) * dx > 0 : (n.y - current.y) * dy > 0),
            )
            .sort((a, b) => {
              const score = (n) => {
                const x = n.x - current.x,
                  y = n.y - current.y;
                return Math.hypot(x, y) + (dx ? Math.abs(y) : Math.abs(x)) * 2;
              };
              return score(a) - score(b);
            });
          if (candidates.length) focusNote(candidates[0].id);
        } else if (key === "?") help();
      });
      document.addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          space = false;
          if (!gesture) viewport.style.cursor = "";
        }
      });
      window.addEventListener("blur", () => {
        space = false;
        if (!gesture) viewport.style.cursor = "";
        syncEditor();
        flushSave();
      });
      window.addEventListener("resize", positionEditor);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          syncEditor();
          flushSave();
        }
      });
      window.addEventListener("pagehide", () => {
        syncEditor();
        flushSave();
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty || $("#save-status").textContent === "Saving…") {
          syncEditor();
          flushSave();
          e.preventDefault();
          e.returnValue = "";
        }
      });
      window.addEventListener("load", () => {
        if (state && !editing) renderNotes();
      });
      init();
    </script>
  </body>
</html>
